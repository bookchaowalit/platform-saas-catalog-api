[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solo-empire-saas-catalog-api"
version = "0.1.0"
description = "Read-only projection of the Solo Empire free SaaS catalog"
requires-python = ">=3.11"
dependencies = ["solo-empire-service-auth>=0.1.0,<0.2"]

[tool.setuptools]
py-modules = ["server", "saas_catalog_mcp"]

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3", "httpx>=0.27,<1"]  # saas-catalog-mcp (saas_catalog_mcp.py); not needed by the API image
dev = ["pytest>=8", "mcp>=2.3,<3", "httpx>=0.27,<1"]

[project.scripts]
saas-catalog-mcp = "saas_catalog_mcp:main"

[tool.ruff]
target-version = "py311"
# vendor/ is a verbatim copy of the shared service-auth package; it is linted where it is maintained.
extend-exclude = ["vendor"]

[tool.ruff.lint]
# Pin the classic default rule set (as the sibling repos do) so newer Ruff releases with wider
# defaults do not change what CI enforces.
select = ["E4", "E7", "E9", "F"]
